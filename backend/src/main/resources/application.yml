spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecopulse}
    username: ${DATABASE_USER:ecopulse}
    password: ${DATABASE_PASSWORD:ecopulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
